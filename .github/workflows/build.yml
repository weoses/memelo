name: ci

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set current date as release version
        id: set_version
        run: |
          # Format the date as YYYY-MM-DD-HH-MM-SS
          VERSION_DATE=$(date +'%Y%m%d%H%M%S')
          echo "RELEASE_VERSION=$VERSION_DATE" >> $GITHUB_ENV
        shell: bash

      - name: "STORAGE: Build and push" 
        uses: docker/build-push-action@v6
        with:
          push: ${{github.ref == 'refs/heads/master'}}
          file: Dockerfile-storage-service
          tags: ghcr.io/weoses/storage-service:${{ env.RELEASE_VERSION }}

      - name: "TELEGRAM: Build and push" 
        uses: docker/build-push-action@v6
        with:
          push: ${{github.ref == 'refs/heads/master'}}
          file: Dockerfile-telegram-service
          tags: ghcr.io/weoses/telegram-service:${{ env.RELEASE_VERSION }}