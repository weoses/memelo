name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "STORAGE: Build and push"
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile-storage-service
          tags: ghcr.io/weoses/storage-service:dev-${{ github.sha }}

      - name: "TELEGRAM: Build and push"
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile-telegram-service
          tags: ghcr.io/weoses/telegram-service:dev-${{ github.sha }}


  test-deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    environment: memelo-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod

      - name: Deploy via Ansible
        uses: dawidd6/action-ansible-playbook@v9
        with:
          playbook: deploy.yml
          directory: ansible/
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{secrets.VAULT_PASSWORD}}
          options: |
            --inventory inventory/test.yml
            --limit test
            --extra-vars release_version=dev-${{ github.sha }}
            --extra-vars commit_hash=${{ github.sha }}
            --extra-vars repo_url=${{ github.server_url }}/${{ github.repository }}.git

      - name: Tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: tests/e2e
        env:
          STORAGE_SERVICE_URI: ${{ secrets.TEST_STORAGE_SERVICE_URI }}
          STORAGE_SERVICE_USERNAME: ${{ secrets.TEST_PROXY_USERNAME }}
          STORAGE_SERVICE_PASSWORD: ${{ secrets.TEST_PROXY_PASSWORD }}

  release-deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    environment: memelo-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod

      - name: Deploy via Ansible
        uses: dawidd6/action-ansible-playbook@v9
        with:
          playbook: deploy.yml
          directory: ansible/
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{secrets.VAULT_PASSWORD}}
          options: |
            --inventory inventory/test.yml
            --limit production
            --extra-vars release_version=${{ github.ref_name }}
            --extra-vars commit_hash=${{ github.ref_name }}
            --extra-vars repo_url=${{ github.server_url }}/${{ github.repository }}.git

      - name: Tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: tests/e2e
        env:
          STORAGE_SERVICE_URI: ${{ secrets.TEST_STORAGE_SERVICE_URI }}
          STORAGE_SERVICE_USERNAME: ${{ secrets.TEST_PROXY_USERNAME }}
          STORAGE_SERVICE_PASSWORD: ${{ secrets.TEST_PROXY_PASSWORD }}
