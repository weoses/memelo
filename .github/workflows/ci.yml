name: CI

on:
  push:
    branches-ignore:
      - "**"
    tags:
      - 'v**'
jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "storage", "telegram", "webapp"]
      max-parallel: 10
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libvips-dev ffmpeg cpulimit

      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{matrix.service}}-service/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Go tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: ${{matrix.service}}-service

  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "storage", "telegram", "webapp" ]
      max-parallel: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          push: true
          file: Dockerfile-${{matrix.service}}-service
          tags: |
            ghcr.io/weoses/${{matrix.service}}-service:${{ github.ref_name }}
            ghcr.io/weoses/${{matrix.service}}-service:latest
          cache-from: type=registry,ref=ghcr.io/weoses/${{matrix.service}}-service:latest
          cache-to: type=inline