name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'
jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "storage", "telegram", "webapp"]
      max-parallel: 10
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libvips-dev ffmpeg cpulimit

      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{matrix.service}}-service/go.mod

      - name: Go tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: ${{matrix.service}}-service

  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "storage", "telegram", "webapp" ]
      max-parallel: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile-${{matrix.service}}-service
          tags: ghcr.io/weoses/${{matrix.service}}:dev-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - run-tests
      - build-services
    strategy:
      matrix:
        target_env: [ test, production ]
      max-parallel: 1 # Set to 1 for sequential, or more for parallel
    environment: ${{ matrix.target_env == 'production' && 'production' || 'memelo-test' }}
    steps:
      - uses: actions/checkout@v5

      - name: Run server setup
        uses: dawidd6/action-ansible-playbook@v9
        with:
          requirements: requirements.yml
          playbook: server_setup.yml
          directory: ansible/
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
          options: |
            --inventory inventory/${{ matrix.target_env  }}.yml
            --limit ${{ matrix.target_env  }}

      - name: Deploy via Ansible
        uses: dawidd6/action-ansible-playbook@v9
        with:
          requirements: requirements.yml
          playbook: deploy.yml
          directory: ansible/
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          vault_password: ${{secrets.VAULT_PASSWORD}}
          options: |
            --inventory inventory/${{ matrix.target_env  }}.yml
            --limit ${{ matrix.target_env  }}
            --extra-vars release_version=dev-${{ github.sha }}
            --extra-vars commit_hash=${{ github.sha }}
            --extra-vars repo_url=${{ github.server_url }}/${{ github.repository }}.git

      - name: Tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: tests/e2e
        env:
          STORAGE_SERVICE_URI: ${{ secrets.TEST_STORAGE_SERVICE_URI }}
          STORAGE_SERVICE_USERNAME: ${{ secrets.TEST_PROXY_USERNAME }}
          STORAGE_SERVICE_PASSWORD: ${{ secrets.TEST_PROXY_PASSWORD }}
        if: ${{ matrix.target_env  == 'production' }}
