---
# Deployment
deploy_path: /home/github-runner/application

# S3 / media storage (shared endpoint and access credentials)
s3_endpoint: "storage.googleapis.com"
s3_secure: "true"

# Postgres
postgres_db: telegram

# FFmpeg
ffmpeg_binary: ffmpeg
ffmpeg_cpulimit: 80
ffmpeg_threadslimit:

# Gemini embedding model
gemini_embedding_model: "gemini-embedding-2-preview"
gemini_embedding_api_endpoint: ""

# Gemini extractor model
gemini_extractor_model: "gemini-3-flash-preview"
gemini_extractor_api_endpoint: ""


# filled by runner
release_version:
commit_hash:
repo_url:

# Nginx
nginx_log_dir: /var/log/nginx
nginx_max_body_size: 100M
nginx_proxy_read_timeout: 600
nginx_htpasswd_file: /etc/apache2/.htpasswd
nginx_htpasswd_realm: "Proxy"

# Ports
storage_service_port: 7001
telegram_service_port: 7002
webapp_service_port: 7003
