---
- name: Ensure deploy directory exists
  file:
    path: "{{ deploy_path }}"
    state: directory
    mode: "0755"

- name: Clone repository if not present
  git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ commit_hash }}"
    force: true
  register: git_result

- name: Template .env file
  template:
    src: .env.j2
    dest: "{{ deploy_path }}/.env"
    mode: "0600"

- name: Copy ansible docker-compose file
  copy:
    src: "{{ playbook_dir }}/docker-compose.deploy.yml"
    dest: "{{ deploy_path }}/docker-compose.deploy.yml"
    mode: "0644"

- name: Stop and remove existing containers
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    files:
      - docker-compose.deploy.yml
    project_name: memelo
    state: absent
    remove_orphans: true
  ignore_errors: true

- name: Pull images and start services
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    files:
      - docker-compose.deploy.yml
    project_name: memelo
    state: present
    pull: always
    wait: true
    wait_timeout: 300