openapi: 3.0.0
info:
  description: ''
  version: "1.0.0"
  title: 'Meme-server'

paths:
  /api/v1/accounts/{AccountId}/check-duplicates:
    post:
      parameters:
        - $ref: "#/components/parameters/AccountId"
      operationId: "CheckDuplicates"
      responses:
        200:
          description: ok
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  /api/v1/accounts/{AccountId}/update-ocr:
    post:
      parameters:
        - $ref: "#/components/parameters/AccountId"
      operationId: "UpdateOcr"
      responses:
        200:
          description: ok
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
  
  /api/v1/accounts/{AccountId}/update-ocr/{MemeId}:
    post:
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/MemeId"
      operationId: "UpdateOcrOne"
      responses:
        200:
          description: ok
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"

  /api/v1/accounts/{AccountId}/meme:
    get:
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/SearchAfterId"
        - $ref: "#/components/parameters/PageSize"
      operationId: "SearchMeme"
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchMemeResponseItemDto"
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
    post:
      operationId: "CreateMeme"
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageRequestDto"
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMemeResponseDto"
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"


  /api/v1/accounts/{AccountId}/meme/{MemeId}/image/url:
    get:
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/MemeId"
      operationId: "GetMemeImageUrl"
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUrlDto"
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"

  /api/v1/accounts/{AccountId}/meme/{MemeId}:
    delete:
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/MemeId"
      operationId: "DeleteMeme"
      responses:
        200:
          description: ok
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"

  /api/v1/accounts/{AccountId}/meme/{MemeId}/image/thumb/url:
    get:
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/MemeId"
      operationId: "GetMemeImageThumbUrl"
      responses:
        200:
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUrlDto"
        500:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
components:
  parameters:
    Query:
      in: query
      required: true
      name: Query
      schema:
        type: string
    SearchAfterId:
      in: query
      required: false
      name: SearchAfterSortId
      schema:
        type: integer
        format: int64
    PageSize:
      in: query
      required: false
      name: PageSize
      schema:
        type: integer
    MemeId:
      in: path
      required: true
      name: MemeId
      schema:
        type: string
        format: uuid

    AccountId:
      in: path
      required: true
      name: AccountId
      schema:
        type: string
        format: uuid

  schemas:
    SearchMemeResponseItemDto:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        SortId:
          type: integer
          format: int64
        OcrResult:
          type: string
        Image:
          $ref: "#/components/schemas/ImageUrlDto"
        Thumbnail:
          $ref: "#/components/schemas/ImageUrlDto"
        Hash:
          type: string

    CreateMemeResponseDto:
      type: object
      required:
        - Id
        - OcrResult
        - Hash
        - DuplicateStatus
      properties:
        Id:
          type: string
          format: uuid
        OcrResult:
          type: string
        Hash:
          type: string
        DuplicateStatus:
          $ref: "#/components/schemas/DuplicateStatus"

    CreateImageRequestDto:
      type: object
      required:
        - ImageBase64
      properties:
        ImageBase64:
          type: string

    ImageUrlDto:
      type: object
      required:
        - Url
        - Width
        - Height
      properties:
        Url:
          type: string
        Width:
          type: integer
        Height:
          type: integer

    DuplicateStatus:
      type: string
      enum:
        - duplicate_image
        - duplicate_hash
        - new

    ErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        error:
          type: string