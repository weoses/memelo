# Values for the ingress-nginx-controller chart (ingress-nginx/ingress-nginx).
#
# Despite no cloud-controller-manager pod being visible in kube-system,
# Vultr's VKE clusters *do* provision Service type=LoadBalancer (the CCM
# runs on Vultr's managed side, not as a visible in-cluster pod) — confirmed
# by test-deploying a LoadBalancer Service, which got a real external IP
# within ~2 minutes. There is no annotation to pin that LB to a pre-existing
# reserved IP, so DNS must be pointed at whatever IP this Service is
# assigned after install (see cluster/README.md).
#
# Client source IPs: the Vultr LB proxies connections, so nginx sees the LB's
# private VPC IP unless PROXY protocol is enabled on both the LB and nginx.
# The memelo webhook ingress needs real client IPs for its
# whitelist-source-range (Telegram IPs); without them every webhook request
# is 403'd.
#
# vultr-loadbalancer-hostname makes the Service status report a hostname
# instead of the LB IP, so kube-proxy doesn't short-circuit in-cluster
# traffic to the LB IP (which would reach nginx without a PROXY header and
# be rejected — e.g. cert-manager's HTTP-01 self-check). That DNS name must
# resolve to the LB IP.
controller:
  config:
    use-proxy-protocol: "true"
  service:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/vultr-loadbalancer-proxy-protocol: "true"
      service.beta.kubernetes.io/vultr-loadbalancer-hostname: "lb.cluster.memelo.cloud"