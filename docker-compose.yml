services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.2
    environment:
        ES_JAVA_OPTS: ${ELASTIC_JAVA_OPTS:--Xmx1g}
        bootstrap.memory_lock: true
        discovery.type: single-node
        xpack.security.enabled: true
        xpack.security.enrollment.enabled: false
        ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
        ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200", "-u", "${ELASTIC_USERNAME:-elastic}:${ELASTIC_PASSWORD:-elastic}" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - "elastic_data:/usr/share/elasticsearch/data"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio123}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
    ports:
      - "127.0.0.1:9000:9000"
    command: server /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - env
    volumes:
      - "minio_data:/data"

  storage-service:
    build:
      dockerfile: Dockerfile-storage-service
    image: ghcr.io/weoses/storage-service:${RELEASE_VERSION:-latest}
    environment:
      METADATA_STORAGE_ELASTIC_ADDRESSES: http://elasticsearch:9200
      METADATA_STORAGE_ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
      METADATA_STORAGE_ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}

      TAG_STORAGE_ELASTIC_ADDRESSES: http://elasticsearch:9200
      TAG_STORAGE_ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
      TAG_STORAGE_ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}

      IMAGE_STORAGE_S3_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      IMAGE_STORAGE_S3_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      IMAGE_STORAGE_S3_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      IMAGE_STORAGE_S3_SECURE: ${MINIO_SECURE:-false}

      IMAGE_EMBEDDING_PROJECTNAME: ${IMAGE_EMBEDDING_PROJECTNAME}

      GOOGLE_APPLICATION_CREDENTIALS: /app/creds/creds.json
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    volumes:
      - "./storage-service/config.yaml:/app/config/config.yaml"
      - "${GOOGLE_CREDS_PATH:-$HOME/.config/gcloud/application_default_credentials.json}:/app/creds/creds.json"
    networks:
      - env
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memelo}
      POSTGRES_DB: ${POSTGRES_DB:-telegram}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - env
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memelo} -d ${POSTGRES_DB:-telegram}"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-service:
    build:
      dockerfile: Dockerfile-telegram-service
    image: ghcr.io/weoses/telegram-service:${RELEASE_VERSION:-latest}
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      STORAGE_SERVICE_URI: http://storage-service:7001
      POSTGRES_DSN: postgres://${POSTGRES_USER:-memelo}:${POSTGRES_PASSWORD:-memelo}@postgres:5432/${POSTGRES_DB:-telegram}?sslmode=disable
    restart: unless-stopped
    volumes:
      - "./telegram-service/config.yaml:/app/config/config.yaml"
    networks:
      - env
    depends_on:
      postgres:
        condition: service_healthy
      storage-service:
        condition: service_healthy

networks:
  env:

volumes:
  elastic_data:
  minio_data:
  postgres_data: