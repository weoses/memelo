services:
  storage-service:
    build:
      dockerfile: Dockerfile-storage-service
    image: ghcr.io/weoses/storage-service:${RELEASE_VERSION:-latest}
    environment:
#      METADATA_DB_ELASTIC_ADDRESSES: http://elasticsearch:9200
#      METADATA_DB_ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
#      METADATA_DB_ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}

#      TAG_DB_ELASTIC_ADDRESSES: http://elasticsearch:9200
#      TAG_DB_ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
#      TAG_DB_ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}

      METADATA_DB_ELASTIC_CLOUDID: ${ELASTIC_CLOUDID}
      METADATA_DB_ELASTIC_APIKEY: ${ELASTIC_APIKEY}
      METADATA_DB_INDEX:  ${METADATA_ELASTIC_INDEX}

      TAG_DB_ELASTIC_CLOUDID: ${ELASTIC_CLOUDID}
      TAG_DB_ELASTIC_APIKEY:  ${ELASTIC_APIKEY}
      TAG_DB_INDEX: ${TAG_ELASTIC_INDEX}


      MEDIA_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-service:9000}
      MEDIA_STORAGE_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      MEDIA_STORAGE_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      MEDIA_STORAGE_SECURE: ${MINIO_SECURE:-false}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET}

      TEMP_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-service:9000}
      TEMP_STORAGE_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      TEMP_STORAGE_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      TEMP_STORAGE_SECURE: ${MINIO_SECURE:-false}
      TEMP_STORAGE_BUCKET: ${TEMP_STORAGE_BUCKET}

      MEDIA_EMBEDDING_PROJECTNAME: ${EMBEDDING_PROJECTNAME}
      AUDIO_STT_PROJECTNAME: ${EMBEDDING_PROJECTNAME}

      GOOGLE_APPLICATION_CREDENTIALS: /app/creds/creds.json

      FFMPEG_SERVICE_URI: http://ffmpeg-service:7005

    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    volumes:
      - "./storage-service/config.yaml:/app/config/config.yaml"
      - "${GOOGLE_CREDS_PATH:-$HOME/.config/gcloud/application_default_credentials.json}:/app/creds/creds.json"
    networks:
      - env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7001/health" ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      ffmpeg-service:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memelo}
      POSTGRES_DB: ${POSTGRES_DB:-telegram}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - env
    volumes:
      - "postgres_data:/var/lib/postgresql/temp"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memelo} -d ${POSTGRES_DB:-telegram}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-service:
    build:
      dockerfile: Dockerfile-telegram-service
    image: ghcr.io/weoses/telegram-service:${RELEASE_VERSION:-latest}
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      WEBHOOK_EXTERNALURL: ${TELEGRAM_WEBHOOK_EXTERNALURL}
      STORAGE_SERVICE_URI: http://storage-service:7001
      YOUTUBE_SERVICE_URI: http://youtube-service:7004
      POSTGRES_DSN: postgres://${POSTGRES_USER:-memelo}:${POSTGRES_PASSWORD:-memelo}@postgres:5432/${POSTGRES_DB:-telegram}?sslmode=disable
      TEMP_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-service:9000}
      TEMP_STORAGE_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      TEMP_STORAGE_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      TEMP_STORAGE_SECURE: ${MINIO_SECURE:-false}
      TEMP_STORAGE_BUCKET: ${TEMP_STORAGE_BUCKET}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7002:7002"
    volumes:
      - "./telegram-service/config.yaml:/app/config/config.yaml"
    networks:
      - env
    depends_on:
      postgres:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      youtube-service:
        condition: service_healthy

  youtube-service:
    build:
      dockerfile: Dockerfile-youtube-service
    image: ghcr.io/weoses/youtube-service:${RELEASE_VERSION:-latest}
    environment:
      STORAGE_SERVICE_URI: http://storage-service:7001
      TEMP_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-service:9000}
      TEMP_STORAGE_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      TEMP_STORAGE_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      TEMP_STORAGE_SECURE: ${MINIO_SECURE:-false}
      TEMP_STORAGE_BUCKET: ${TEMP_STORAGE_BUCKET}
      YOUTUBE_MAXVIDEOSIZEBYTES: ${YOUTUBE_MAX_VIDEO_SIZE_BYTES:-524288000}
      YOUTUBE_MAXCONCURRENTDOWNLOADS: ${YOUTUBE_MAX_CONCURRENT_DOWNLOADS:-4}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7003:7003"
    volumes:
      - "./youtube-service/config.yaml:/app/config/config.yaml"
    networks:
      - env
    depends_on:
      storage-service:
        condition: service_healthy

  ffmpeg-service:
    build:
      dockerfile: Dockerfile-ffmpeg-service
    image: ghcr.io/weoses/ffmpeg-service:${RELEASE_VERSION:-latest}
    environment:
      TEMP_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-service:9000}
      TEMP_STORAGE_ACCESSKEY: ${MINIO_ACCESS_KEY:-minio123}
      TEMP_STORAGE_SECRETKEY: ${MINIO_SECRET_KEY:-minio123}
      TEMP_STORAGE_SECURE: ${MINIO_SECURE:-false}
      TEMP_STORAGE_BUCKET: ${TEMP_STORAGE_BUCKET}
      FFMPEG_BINARY: ${FFMPEG_BINARY}
      FFMPEG_CPULIMIT: ${FFMPEG_CPULIMIT}
      FFMPEG_THREADSLIMIT: ${FFMPEG_THREADSLIMIT}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7005:7005"
    volumes:
      - "./ffmpeg-service/config.yaml:/app/config/config.yaml"
    networks:
      - env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7005/health" ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

networks:
  env:

volumes:
  minio_data:
  postgres_data: