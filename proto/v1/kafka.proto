syntax = "proto3";
import "proto/v1/search_service.proto";

option go_package = "github.com/weoses/memelo/gen/proto/v1";
package proto.memelo.v1;

// KafkaCreateMemeRequest wraps CreateMemeRequest with a durable correlation ID.
// kafka_request_id is generated by the producer and echoed in the response so
// callers can match async responses to their original request.
message KafkaCreateMemeRequest {
  string kafka_request_id = 1;
  CreateMemeRequest payload = 2;
}

// KafkaCreateMemeResponse wraps CreateMemeResponse with the same correlation ID.
// error_message is non-empty when processing failed; payload will be absent.
message KafkaCreateMemeResponse {
  string kafka_request_id = 1;
  CreateMemeResponse payload = 2;
  string error_message = 3;
}
