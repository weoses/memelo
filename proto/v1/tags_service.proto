syntax = "proto3";
import "proto/v1/common.proto";

option go_package = "github.com/weoses/memelo/gen/proto/v1";
package proto.memelo.v1;


message Tag {
  string id = 1;
  string tag = 2;
  string description = 3;
}

message CreateTagRequest {
  string account_id = 1;
  string tag = 2;
  string description = 3;
}

message CreateTagResponse {
  Tag result = 1;
}

message DeleteTagRequest {
  string account_id = 1;
  string id = 2;
}

message DeleteTagResponse {
  Tag result = 1;
}

message ListTagRequest {
  string account_id = 1;
  optional string tagName = 2;
  optional string tagDescription = 3;
}

message ListTagResponse {
  repeated Tag result = 1;
}

service TagsService {
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc ListTags(ListTagRequest) returns (ListTagResponse);

  rpc DeleteAll(DeleteAllRequest) returns (DeleteAllResponse);
}
