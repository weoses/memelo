log:
  Level: info

server:
  ListenAddress: :7001

extracting:
  EmbeddingDimensions: 1408
  VideoSliceIntervalSec: 15

search:
  SemanticDuplicateThreshold: 0.955
  SemanticTextSearchThreshold: 0.5
  Fuzziness: "AUTO:4,8"


media-storage:
  Endpoint:
  AccessKey:
  SecretKey:
  Bucket:
  Secure:

temp-storage:
  Endpoint:
  AccessKey:
  SecretKey:
  Bucket:
  Secure:


metadata-db:
  Elastic:
    Addresses:
    Username:
    Password:
    CloudID:
    ApiKey:
  Index:

tag-db:
  Elastic:
    Addresses:
    Username:
    Password:
    CloudID:
    ApiKey:
  Index:

image-converter:
  ThumbSize: 360

ffmpeg:
  FfmpegBinary: ffmpeg
  FfprobeBinary: ffprobe
  CpuLimit: 0
  ThreadsLimit: 0

gemini-extractor:
  apikey:
  apiendpoint:
  model: gemini-3-flash-preview
  prompt: "Analyze this media and call the extract_metadata function with your findings. If you found nothing for parameter, leave parameter empty (except caption)."
  output-tool-description: "Extract structured metadata from the media"
  output-tool-transcription-desc: "Audio transcription or speech-to-text content from the media"
  output-tool-on-screen-text-desc: "Any text visible on screen (OCR)"
  output-tool-caption-desc: "A small caption summarizing the media content. Must not be more than 2-3 words"
  output-tool-audio-track-desc: "An audio track, song, that is at sound background. If it is not famous, or it to quiet, or you not sure, ignore it"
  combine-prompt: "Multiple extractions of video segments are provided below. Synthesize them into a single result by calling extract_metadata. Merge on-screen text and transcripts. Pick the most fitting caption."

gemini-embedding:
  apikey:
  apiendpoint:
  model: "gemini-embedding-2-preview"
